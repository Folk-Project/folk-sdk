name: Update Packagist

on:
  push:
    tags: ['v*']

jobs:
  # Re-run the full test suite + PHPStan on the tagged commit. Packagist is only
  # notified if this passes, so a release can never ship a red build even if the
  # tag is pushed before the develop CI finishes.
  test:
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml

  packagist:
    name: Notify Packagist
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Ping Packagist
        run: |
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/Folk-Project/folk-sdk"}}')
          cat /tmp/response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Packagist API returned HTTP $HTTP_CODE"
            exit 1
          fi
